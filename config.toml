# ============================================================================
#  osu!mania 模拟对战 —— 唯一配置文件
#
#  改这一份文件就能调整：画面/比赛规则/判定/曲库/队伍与玩家/选曲顺序。
#  代码里不再有第二处配置，data/songs.txt、config/teams.txt、config/choose.txt
#  这些旧配置文件已经全部并入这里。
#
#  说明：本文件里的相对路径，一律相对于 config.toml 所在目录（项目根目录），
#        所以从哪个目录启动 main.py 都能正确找到资源。
# ============================================================================


# ---------------------------------------------------------------------------
# 画面与节奏
# ---------------------------------------------------------------------------
[game]
screen_width = 1280          # 窗口宽
screen_height = 720          # 窗口高
fps = 60                     # 帧率
max_render_dist = 1200       # 音符提前多少毫秒进入视野（同时决定屏幕上能看到多远）
debug = false                # true = 在左上角显示当前歌曲时间等调试信息

# --- 各阶段的等待时间（毫秒）---
# 等待期间屏幕中央会实时显示 Countdown:xx（距离比赛真正开始的剩余秒数）
start_delay = 5000           # 从启动到第一场比赛开始前（这段时间在展示曲库）
song_select_delay = 5000     # 从切到选曲页面，到选出本轮曲目
match_start_delay = 5000     # 从选完歌，到比赛真正开始（音乐在这之后才响起）
results_delay = 5000         # 每场打完后，成绩展示停留多久


# ---------------------------------------------------------------------------
# 比赛规则
# ---------------------------------------------------------------------------
[match]
name = "TEST"                        # 比赛名（仅用于显示）
rounds_to_win = 1                    # 先赢几局算赢下比赛（2 = BO3）
# resume = true  → 启动时读取下面的 results 缓存，接着上次没打完的比赛继续
# resume = false → 忽略并清空缓存，每次启动都重新开一场
resume = true
# 赛果缓存：每局一个胜者序号（0 = 第一支队，1 = 第二支队），每局打完自动写回这里，
# 启动时读取。想重新开一场把它清成 [] 即可（或者把 resume 改成 false）。
results = []


# ---------------------------------------------------------------------------
# 判定
# ---------------------------------------------------------------------------
[judge]
# 判定窗口（毫秒），必须从小到大：perfect_g <= perfect <= great <= good <= bad
# 超过 bad 一律算 miss（已经没有单独的 miss 窗口了）
perfect_g = 10                # 完美+
perfect = 28                  # 完美
great = 52                    # 很好
good = 75                     # 好
bad = 100                     # 差
# 每个判定给的基础分
score = { perfect_g = 320, perfect = 300, great = 200, good = 100, bad = 50, miss = 0 }
# 连击奖励的增减：bonus 初始为 bonus_start，每次判定后夹在 0 ~ bonus_max 之间
bonus = { perfect_g = 0.5, perfect = 0.25, great = 0.0, good = -1.0, bad = -3.0, miss = -50.0 }
bonus_start = 100
bonus_max = 100


# ---------------------------------------------------------------------------
# 选手能力值（每首歌开始时重新结算一次）
#
# 判定用的是"落点误差"模型：每个音符只结算一次，选手一定会去按，
# 只有"按下去的时刻偏了多少"的分别，误差超出判定窗口就是漏键。
#   落点偏移 = μ + N(0, σ)
#   σ = 准度地板 + 密度压力²×38 + 疲劳×15 + 不稳定×3   （越往上越飘）
#   μ = 密度压力²×50 + 疲劳×22                        （跟不上、累了会越打越晚）
#
# 五项能力都是 0~100，基准由名字哈希决定 —— 同一个名字每局底子完全一样：
#   手速 speed         能从容处理多密的同键间隔；跟不上时误差被放大、整体打晚
#   体力 stamina       每首歌的耐久；池子越空，落点越飘越晚，后半段开始漏
#   准度 avg_accuracy  落点误差的地板（只影响打得多准，不会凭空漏键）
#   稳定 consistency   落点误差的抖动幅度 + 每局手感的波动幅度
#   心态 mentality     连击 >500 且"体力吃紧"时手抖一下：落点被推后约 120ms，判成 BAD 或擦边 MISS
#                      压力大小取自"还剩多少体力"，所以低难图几乎不会触发
#
# 于是难度自然分化：
#   低难图  密度压力≈0、也几乎不疲劳 → σ 基本只剩准度那一项 → 人人在 99% 上下比准度
#   高难图  密度压力把 σ 顶到几十毫秒 → 准度的几毫秒差别被淹没 → 手速和耐力决定上限
#
# 选手风格也由名字哈希决定（同一个名字风格固定），风格会给上面五项加偏置：
#   均衡 / 手速型 / 耐力型 / 稳准型 / 爆发型 / 大心脏 / 赌徒 / 天才（天才 1/16 概率）
# 想换个人，改 [[teams]] 里的名字就行；控制台每局开局会打印每人的风格与能力值。
# ---------------------------------------------------------------------------
[players]
# 每首歌开始时重新读取本文件里的队员名单：改完 [[teams]] 不用重启，下一首就生效
reread_roster = true
# 每首歌开始时重新抽"手感"：五项能力各自随机 ±form_range
# 实际幅度还要按稳定性打折：实际幅度 = form_range × (1 - 0.75 × 稳定性/100)
# 所以越稳的选手每局越不容易大起大落；填 0 = 完全关掉手感波动
form_range = 10


# ---------------------------------------------------------------------------
# 曲目分类标签的颜色：按曲目 id 的前两个字母取色（左边列表里的小标签）
# ---------------------------------------------------------------------------
[pool_colors]
RC = [187, 255, 255]
SP = [255, 215, 0]
ST = [255, 165, 0]
HD = [255, 0, 0]
TB = [200, 200, 200]


# ===========================================================================
#  曲库：一场比赛能选的全部曲目
#  folder 指向一个谱面文件夹，里面放 .osu 谱面和音频
#  beatmap / audio 不填就自动在 folder 里找（谱面找唯一的 .osu，
#  音频优先用谱面里 AudioFilename 指定的那个，再退回到 audio.mp3/.ogg/.wav）
# ===========================================================================
[[songs]]
id = "RC1"                                              # 前两位是上面 pool_colors 里的分类
title = "Lian Fan Nao Ye Rong Ru Tian Kong"
artist = "Monster Siren Records"
folder = "data/beatmaps/2598781"
# beatmap = "xxx.osu"
# audio = "audio.mp3"

[[songs]]
id = "ST1"
title = "far in the blue sky... [42]"
artist = "saikoro"
folder = "data/beatmaps/767294 saikoro - far in the blue sky"
# 这个文件夹里有 9 个 .osu（难度 33/38/42 + 42 的 0.9x~1.2x 变速版），
# 不写 beatmap 会自动挑到 [33]，想换难度/倍速改这一行即可
beatmap = "Saikoro - far in the blue sky... (1nar) [42].osu"

[[songs]]
id = "TB"                                              # TB = 决胜曲（osu!mania 7K World Cup 2026 的 TB 曲）
title = "Vacant Rhapsody"
artist = "penoreri"
folder = "data/beatmaps/2514857 penoreri - Vacant Rhapsody"
# 文件夹里只有一张 .osu（[Varium Rosarium]，CircleSize:4），不写 beatmap 自动识别；
# 音频用它 AudioFilename 指定的 audio.mp3


# ===========================================================================
#  队伍与玩家：必须是 2 支队伍，每队 1~3 名玩家（名字直接写在这里）
#  玩家能力值由名字哈希生成，换个名字就是换个人
# ===========================================================================
[[teams]]
name = "The Wanderers"
color = [255, 100, 90]
players = ["Advancer","Voyager","Uninhibited"]

[[teams]]
name = "Gamer Two"
color = [0, 150, 255]
players = ["m0NESY","huNter","JKS"]


# ===========================================================================
#  选曲顺序：第 1 轮用第一条，第 2 轮用第二条，以此类推
#  song 填上面曲库里的 id
#  team 填 0/1 指定这一轮由哪队选歌，不填就按轮次自动轮换（0,1,0,1...）
#  全部用完之后会自动在曲库里循环
# ===========================================================================
# BO3（rounds_to_win = 2）最多打 3 局，所以这里写满 3 条：
# 第 1 局 RC1、第 2 局 ST1、第 3 局（1:1 时的决胜局）才是 TB 的 Vacant Rhapsody。
# 2:0 直接结束，TB 就不会被选到 —— 这就是决胜曲该有的出场时机。

[[picks]]
song = "TB"
