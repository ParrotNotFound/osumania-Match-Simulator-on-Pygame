# ============================================================================
#  osu!mania 模拟对战 —— 唯一配置文件
#
#  改这一份文件就能调整：画面/比赛规则/判定/曲库/队伍与玩家/选曲顺序。
#  代码里不再有第二处配置，data/songs.txt、config/teams.txt、config/choose.txt
#  这些旧配置文件已经全部并入这里。
#
#  说明：本文件里的相对路径，一律相对于 config.toml 所在目录（项目根目录），
#        所以从哪个目录启动 main.py 都能正确找到资源。
# ============================================================================


# ---------------------------------------------------------------------------
# 画面与节奏
# ---------------------------------------------------------------------------
[game]
screen_width = 1280          # 窗口宽
screen_height = 720          # 窗口高
fps = 60                     # 帧率
max_render_dist = 1200       # 音符提前多少毫秒进入视野（同时决定屏幕上能看到多远）
debug = false                # true = 在左上角显示当前歌曲时间等调试信息

# --- 无 UI 比赛 ---
# true = 不弹 pygame 窗口、不渲染、不等真实时间，用虚拟时钟尽快把整场比赛跑完，
#        分数和赛果打到控制台（判定逻辑与正常对局完全一致，只是不再实时播放）。
headless = false

# --- 各阶段的等待时间（毫秒）---
# 等待期间屏幕中央会实时显示 Countdown:xx（距离比赛真正开始的剩余秒数）
start_delay = 5000           # 从启动到第一场比赛开始前（这段时间在展示曲库）
song_select_delay = 5000     # 从切到选曲页面，到选出本轮曲目
match_start_delay = 5000     # 从选完歌，到比赛真正开始（音乐在这之后才响起）
results_delay = 5000         # 每场打完后，成绩展示停留多久


# ---------------------------------------------------------------------------
# 比赛规则
# ---------------------------------------------------------------------------
[match]
name = "TEST"                        # 比赛名（仅用于显示）
rounds_to_win = 3                 # 先赢几局算赢下比赛（2 = BO3）—— 计分赛模式下无效
# resume = true  → 启动时读取下面的 results 缓存，接着上次没打完的比赛继续
# resume = false → 忽略并清空缓存，每次启动都重新开一场
# （计分赛模式需要完整的逐曲成绩，所以那个模式下总是重新开一场）
resume = true
# 赛果缓存：每局一个胜者序号（0 = 第一支队，1 = 第二支队），每局打完自动写回这里，
# 启动时读取。想重新开一场把它清成 [] 即可（或者把 resume 改成 false）。
results = [1, 0, 0, 1, 1]

# --- 计分赛模式 ---
# true = 不管 rounds_to_win，把下面 [[picks]] 里写的曲目按顺序各打一遍，
#        结束后按所有曲目的总分排名，成绩写进下面的 Excel，
#        结算画面也从"谁赢"换成总分排名榜。
#        [[songs]] 是曲库（可供选曲的池子），[[picks]] 才是计分赛实际要打的曲目表；
#        没写 [[picks]] 时会退化成打整个曲库。
score_mode = false
excel_file = "data/score_match.xlsx"  # 计分赛成绩表写到哪（相对路径基于本文件）

# 常规赛果表：比赛打完（决出胜负）时把每一局双方得分写到这里。
# 不管是不是无 UI 模式、是不是计分赛，都会写。
results_excel = "data/match_results.xlsx"


# ---------------------------------------------------------------------------
# 判定
# ---------------------------------------------------------------------------
[judge]
# 判定窗口是否跟随谱面 OD：
#   true  = 每张谱按自己的 OverallDifficulty 重算窗口（走 lazer 的 mania 窗口曲线：
#           OD0/OD5/OD10 三点折线插值，再 floor(x)+0.5），下面五个固定值就不生效了
#   false = 固定用下面这五个值
follow_chart_od = true

# 固定窗口（毫秒，半宽），必须从小到大：perfect_g <= perfect <= great <= good <= bad
# 超过 bad 一律算 miss（没有单独的 miss 窗口）
#
# 下面这组是 osu!lazer 的 mania 判定窗口在 **OD10** 下的取值，
# 五档依次对应 lazer 的 Perfect / Great / Good / Ok / Meh。
# （源码 osu.Game.Rulesets.Mania/Scoring/ManiaHitWindows.cs 里 OD10 是
#   13.9 / 34 / 67 / 97 / 121，lazer 会 floor(x) + 0.5，所以是下面这些 .5 的数）
perfect_g = 13.5              # lazer: Perfect
perfect = 34.5                # lazer: Great
great = 67.5                  # lazer: Good
good = 97.5                   # lazer: Ok
bad = 121.5                   # lazer: Meh

# 分值不再由这里决定 —— 计分整段照搬 osu!lazer 的 mania 方案：
#   总分 = 150000 × 连击进度 + 850000 × 准度^(2 + 2×准度) × 准度进度
#   连击分增量 = 基础分 × clamp(log4(当前连击), 0.5, log4(400))
#   判定权重 = Perfect 305 / Great 300 / Good 200 / Ok 100 / Meh 50 / Miss 0
#             （本项目的 perfect_g/perfect/great/good/bad 一一对应这五档）
# 权重写在 src/entities/player.py 的 ACCURACY_BASE / COMBO_BASE_SCORE，改那里即可。


# ---------------------------------------------------------------------------
# 选手能力值（每首歌开始时重新结算一次）
#
# 判定用的是"落点误差"模型：每个音符只结算一次，选手一定会去按，
# 只有"按下去的时刻偏了多少"的分别，误差超出判定窗口就是漏键。
#   落点偏移 = μ + N(0, σ)
#   σ = 准度地板 + 密度压力²×38 + 疲劳×15 + 不稳定×3   （越往上越飘）
#   μ =             密度压力²×50 + 疲劳×22            （跟不上、累了会越打越晚）
#
# 准度地板是**曲线**（不是直线）：σ = 1.5 + 24.5 × ((100 − 准度)/100)²
#   准度  0 → 26.0ms    20 → 17.2    40 → 10.3    50 → 7.6
#         60 →  5.4     70 →  3.7    80 →  2.5    90 → 1.7    100 → 1.5
#   取曲线是为了让**简单谱面**上准度也能分高下：直线写法下准度 40 与 80 的 σ
#   都远在大 P 窗口里，大 P 率一个 96% 一个 100%，准确率只差 0.05pp，等于没区别。
#   曲线参数（TIMING_SIGMA_MAX / TIMING_SIGMA_EXPONENT）在 src/entities/player.py。
#
# 五项能力都是 0~100，基准由名字哈希决定 —— 同一个名字每局底子完全一样：
#   手速 speed         能从容处理多密的同键间隔；跟不上时误差被放大、整体打晚
#   体力 stamina       每首歌的耐久；池子越空，落点越飘越晚，后半段开始漏
#   准度 avg_accuracy  落点误差的地板（只影响打得多准，不会凭空漏键）
#   稳定 consistency   落点误差的抖动幅度 + 每局手感的波动幅度
#   心态 mentality     连击 >500 且"体力吃紧"时手抖一下：落点被推后约 120ms，判成 BAD 或擦边 MISS
#                      压力大小取自"还剩多少体力"，所以低难图几乎不会触发
#
# 于是难度自然分化：
#   低难图  密度压力≈0、也几乎不疲劳 → σ 基本只剩准度那一项 → 大 P 率能从 67% 差到 100%
#   高难图  密度压力把 σ 顶到几十毫秒 → 准度的相对权重被摊薄 → 手速和耐力决定上限
#
# 选手风格也由名字哈希决定（同一个名字风格固定），风格会给上面五项加偏置：
#   均衡 / 手速型 / 耐力型 / 稳准型 / 爆发型 / 大心脏 / 赌徒 / 天才（天才 1/16 概率）
# 想换个人，改 [[teams]] 里的名字就行；控制台每局开局会打印每人的风格与能力值。
# ---------------------------------------------------------------------------
[players]
# 每首歌开始时重新读取本文件里的队员名单：改完 [[teams]] 不用重启，下一首就生效
reread_roster = true
# 每首歌开始时重新抽"手感"：五项能力各自随机 ±form_range
# 实际幅度还要按稳定性打折：实际幅度 = form_range × (1 - 0.75 × 稳定性/100)
# 所以越稳的选手每局越不容易大起大落；填 0 = 完全关掉手感波动
form_range = 20


# ---------------------------------------------------------------------------
# 曲目分类标签的颜色：按曲目 id 的前两个字母取色（左边列表里的小标签）
# ---------------------------------------------------------------------------
[pool_colors]
RC = [187, 255, 255]
SP = [255, 215, 0]
HB = [255, 215, 0]
ST = [255, 165, 0]
HD = [255, 0, 0]
LN = [255, 0, 238]
TB = [200, 200, 200]


# ===========================================================================
