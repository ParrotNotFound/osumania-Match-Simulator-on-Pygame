#  folder 指向一个谱面文件夹，里面放 .osu 谱面和音频
#  beatmap / audio 不填就自动在 folder 里找（谱面找唯一的 .osu，
#  音频优先用谱面里 AudioFilename 指定的那个，再退回到 audio.mp3/.ogg/.wav）
