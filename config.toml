# ===========================================================================
#  队伍与玩家：必须是 2 支队伍，每队 1~3 名玩家（名字直接写在这里）
#  玩家能力值由名字哈希生成，换个名字就是换个人
# ===========================================================================
[[teams]]
name = "Red"
color = [255, 100, 90]
players = ["R1","R2","R3"]

[[teams]]
name = "Blue"
color = [0, 150, 255]
players = ["B1","B2","B3"]


# ===========================================================================
#  选曲顺序：第 1 轮用第一条，第 2 轮用第二条，以此类推
#  song 填上面曲库里的 id
#  team 填 0/1 指定这一轮由哪队选歌，不填就按轮次自动轮换（0,1,0,1...）
#  全部用完之后会自动在曲库里循环
# ===========================================================================
# 曲库现在正好是这四首 RC，picks 也按同样顺序排满：第 1 局 RC1、第 2 局 RC2、第 3 局 RC3、第 4 局 RC4。
# 注意当前 rounds_to_win = 1（BO1），普通模式下只打得到第 1 局；要四首都打一遍请把 score_mode 打开
[[picks]]
song = "RC1"
[[picks]]
song = "HB1"
[[picks]]
song = "HB2"
[[picks]]
song = "RC4"
[[picks]]
song = "TB"
